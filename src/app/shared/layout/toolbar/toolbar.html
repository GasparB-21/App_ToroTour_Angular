<header class="toolbar" aria-label="Cabecera">
    <form class="searchbar" role="search">
        <img src="icons/toolbar/icon-lupa.png"
            class="sb-img"
            alt=""
            aria-hidden="true"
        >

        <label for="sb" class="sr-only">Buscar eventos</label>

        <input
            id="sb"
            name="search"
            type="search"
            placeholder="Buscar eventos"
            autocomplete="off"
            aria-controls="lista-eventos"
        >
    </form>

    <button class="btn-filtros" 
            type="button"
            aria-label="Abrir filtros">
        <img src="icons/toolbar/icon-filter.png" alt="" aria-hidden="true" />
    </button>
</header>
