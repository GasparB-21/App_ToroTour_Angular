<header class="toolbar" aria-label="Cabecera">
    <div class="searchbar" role="search">
        <img src="icons/toolbar/lupa-icon.png" class="sb-img" alt="" aria-hidden="true" />
        <label for="sb" class="sr-only">Buscar eventos</label>
        <input id="sb" 
               name="sb" 
               type="search" 
               placeholder="Buscar eventos" 
               inputmode="search" 
               autocomplete="off"/>
    </div>

    <button class="btn-filtros" 
            type="button"
            aria-label="Abrir filtros">
        <img src="icons/toolbar/filter-icon.png" alt="" aria-hidden="true" />
    </button>
</header>
