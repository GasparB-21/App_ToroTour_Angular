<article class="card-map">
    <div class="card-content">
        <div class="card-text">
            <h3 class="card-title">{{ titulo() || 'Selecciona un monumento' }}</h3>
            <p class="card-meta"><u>Estilo</u>: {{ tipo() || '-' }}</p>
        </div>
        <button 
            class="btn-ver-detalles" 
            [routerLink]="['/monumentos', 'detalles', monumentoId()]" 
            routerLinkActive="active"
            [disabled]="!monumentoId()">
            Ver detalles
        </button>
    </div>
</article>
