<main aria-label="Mapa de monumentos">
    <section id="map" aria-label="Mapa de monumentos"></section>   
    
    <div class="cta-wrap--map">
        <a class="btn-pill" routerLink="/monumentos/listado">Mostrar lista</a>
    </div>

    <div class="map-fab" [class.map-fab--open]="isFabOpen()">
        <button class="map-fab__main" (click)="toggleFab()" type="button">⛶</button>

        <button class="map-fab__locate" 
                (click)="executeAction('locate')" 
                [disabled]="!userCoords">
                <img src="icons/flecha-ubicacion.png"
                style="height: 20px; width: 20px;"
                alt="" aria-hidden="true">
        </button>

        @if (isFabOpen()) {
            <div class="map-fab__actions">
                <button class="map-fab__btn" (click)="executeAction('pan-up')" [style.transform]="getTransform('pan-up')">^</button>
                <button class="map-fab__btn" (click)="executeAction('zoom-in')" [style.transform]="getTransform('zoom-in')">＋</button>
                <button class="map-fab__btn" (click)="executeAction('pan-right')" [style.transform]="getTransform('pan-right')">></button>
                <button class="map-fab__btn" (click)="executeAction('pan-down')" [style.transform]="getTransform('pan-down')">v</button>
                <button class="map-fab__btn" (click)="executeAction('zoom-out')" [style.transform]="getTransform('zoom-out')">－</button>
                <button class="map-fab__btn" (click)="executeAction('pan-left')" [style.transform]="getTransform('pan-left')"><</button>
            </div>
        }
    </div>   

    <app-card-preview 
        [titulo]="selectedPoi().name" 
        [tipo]="selectedPoi().type">
    </app-card-preview>
</main>
