<main aria-label="Mapa de monumentos">
    <app-toolbar></app-toolbar>

    <section id="map" aria-label="Mapa de monumentos">
        <div class="map-button-group">
            <btn class="btn-pill" routerLink="/monumentos/listado" alt="Mostrar monumentos como lista"></btn>

            <a routerLink="/monumentos/listado" routerLinkActive="active" class="map-button-list">
                <img src="icons/mapa/lista.png.webp" alt="" aria-hidden="true">
            </a>

            <button class="map-button-controls" (click)="toggleFab()" type="button">⛶</button>

            <button class="map-button-location" (click)="executeAction('locate')" [disabled]="!userCoords">
                    <img src="icons/mapa/flecha-ubicacion.png" alt="" aria-hidden="true">
            </button>

            @if (isFabOpen()) {
                <div class="map-button-actions">
                    <button class="map-fab-btn" (click)="executeAction('pan-up')" [style.transform]="getTransform('pan-up')">^</button>
                    <button class="map-fab-btn" (click)="executeAction('zoom-in')" [style.transform]="getTransform('zoom-in')">＋</button>
                    <button class="map-fab-btn" (click)="executeAction('pan-right')" [style.transform]="getTransform('pan-right')">></button>
                    <button class="map-fab-btn" (click)="executeAction('pan-down')" [style.transform]="getTransform('pan-down')">v</button>
                    <button class="map-fab-btn" (click)="executeAction('zoom-out')" [style.transform]="getTransform('zoom-out')">－</button>
                    <button class="map-fab-btn" (click)="executeAction('pan-left')" [style.transform]="getTransform('pan-left')"><</button>
                </div>
            }
        </div>
    </section>   

    
    

    <app-card-preview 
        [titulo]="selectedPoi().name" 
        [tipo]="selectedPoi().type">
    </app-card-preview>
</main>
