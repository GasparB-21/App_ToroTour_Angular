<main aria-label="Mapa de monumentos">
    <app-toolbar
        (onSearch)="actualizarBusqueda($event)"
        (onFilterClick)="abrirPanelCategorias()">
    </app-toolbar>
    @if (categoriasAbiertas()) {
        <div class="calbar__picker calbar__picker--top">
            <h3 style="grid-column: span 2; margin: 0; font-size: 14px; color: var(--ui-black);">Filtrar por tipo</h3>
            <div class="categories-grid" style="grid-column: span 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;">
                <button class="filter-chip" [class.active]="clasificacionSeleccionada() === null" (click)="filtrarPorCategoria(null)">
                    Todos
                </button>
                @for (cat of categoriasDisponibles(); track cat) {
                    <button class="filter-chip" [class.active]="clasificacionSeleccionada() === cat" (click)="filtrarPorCategoria(cat)">
                        {{ cat }}
                    </button>
                }
            </div>
        </div>
    }

    <section id="map" aria-label="Mapa de monumentos">
        <div class="map-button-group">
            <btn class="btn-pill" routerLink="/monumentos/listado" alt="Mostrar monumentos como lista"></btn>

            <a routerLink="/monumentos/listado" routerLinkActive="active" class="map-button-list" aria-label="Ir al listado de monumentos">
                <img src="icons/mapa/icon-lista.png.webp" alt="" aria-hidden="true">
            </a>

            <!--button class="map-button-controls" (click)="toggleFab()" type="button" aria-label="Abrir botones de accesibilidad en el mapa">⛶</button-->
            <button class="map-button-controls" (click)="toggleFab()" type="button" aria-label="Abrir botones de accesibilidad en el mapa">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <polyline points="4 9 4 4 9 4"></polyline>
                    <polyline points="15 4 20 4 20 9"></polyline>
                    <polyline points="20 15 20 20 15 20"></polyline>
                    <polyline points="9 20 4 20 4 15"></polyline>
                </svg>
            </button>

            <button class="map-button-location" (click)="executeAction('locate')" [disabled]="!userCoords()" aria-label="Centrar la vista del mapa en la ubicación del usuario">
                    <img src="icons/mapa/icon-flecha-ubicacion.png" alt="" aria-hidden="true">
            </button>

            @if (isFabOpen()) {
                <div class="map-button-actions">
                    <button class="map-fab-btn" (click)="executeAction('pan-up')" [style.transform]="getTransform('pan-up')" aria-label="Desplazar la vista del mapa hacia arriba">
                        <!--^-->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="6 15 12 9 18 15"></polyline>
                        </svg>
                    </button>
                    <button class="map-fab-btn" (click)="executeAction('zoom-in')" [style.transform]="getTransform('zoom-in')" aria-label="Aumentar el zoom en el mapa">
                        <!--＋-->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"  aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="11" y1="8" x2="11" y2="14"></line>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                            <line x1="16" y1="16" x2="21" y2="21"></line>
                            </svg>
                    </button>
                    <button class="map-fab-btn" (click)="executeAction('pan-right')" [style.transform]="getTransform('pan-right')" aria-label="Desplazar la vista del mapa hacia la derecha">
                        <!-->-->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"  aria-hidden="true">
                            <polyline points="9 6 15 12 9 18"></polyline>
                        </svg>
                    </button>
                    <button class="map-fab-btn" (click)="executeAction('pan-down')" [style.transform]="getTransform('pan-down')" aria-label="Desplazar la vista del mapa hacia abajo">
                        <!--v-->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <button class="map-fab-btn" (click)="executeAction('zoom-out')" [style.transform]="getTransform('zoom-out')" aria-label="Reducir el zoom en el mapa">
                        <!--－-->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"  aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                            <line x1="16" y1="16" x2="21" y2="21"></line>
                        </svg>
                    </button>
                    <button class="map-fab-btn" (click)="executeAction('pan-left')" [style.transform]="getTransform('pan-left')" aria-label="Desplazar la vista del mapa hacia la izquierda">
                        <!--<-->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"  aria-hidden="true">
                            <polyline points="15 6 9 12 15 18"></polyline>
                        </svg>
                    </button>
                </div>
            }
        </div>
    </section>   

    @if (selectedMonumento()) {
        <app-card-preview 
            [titulo]="selectedMonumento()?.nombre ?? ''" 
            [tipo]="selectedMonumento()?.clasificacion ?? ''"
            [monumentoId]="selectedMonumento()?.id ?? ''"
            [seccion]="'monumentos'">
        </app-card-preview>
    }
</main>
