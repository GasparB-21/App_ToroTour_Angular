<app-toolbar></app-toolbar>

<section class="monumentos-page">
    <h1>Listado de Monumentos</h1>

    <!--Como listadoMonumentos es un observable no podemos iterar directamente sobre él-->
    <!--Solución: usamos async para suscribirnos al Observable y poder extraer el array. Usamos ?? para establacer como default un array vacío-->
    @for(monumento of (listadoMonumentos | async) ?? []; track monumento.id)
    {
        <app-monument-card [monumento] = "monumento"></app-monument-card>
    }
    @empty
    {
        <p>No hay monumentos para mostrar.</p>
    }

    <button class="btn-pill">Mostrar Mapa</button>
</section>
