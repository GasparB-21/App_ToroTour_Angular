<article class="monument-card">
  <div class="monument-card__image" aria-hidden="true"></div>

  <div class="monument-card__content">
    <h3 class="monument-card__title">{{ monumento().nombre }}</h3>
    <p class="monument-card__meta"><u>Tipo</u>: {{ monumento().tipoMonumento }}</p>
    <p class="monument-card__meta"><u>Localidad</u>: {{ monumento().localidad }}</p>
  </div>

  <div class="monument-card__actions">
    <button class="monument-card__icon-button monument-card__icon-button--favorite"
            [class.is-favorite]="esFavorito()"
            type="button"
            aria-label="Anadir o quitar de favoritos"
            [attr.aria-pressed]="esFavorito()"
            (click)="actualizarFavorito()">
      <!--♥-->
      <svg 
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    width="30"
                    height="30"
                    fill="currentColor"
                    aria-hidden="true">

                    <path d="M12 21s-6.716-4.39-9.192-7.086C1.124 12.29 1 10.964 1 10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 .964-.124 2.29-1.808 3.914C18.716 16.61 12 21 12 21z"/>

                </svg>
    </button>
    <button class="monument-card__icon-button monument-card__icon-button--detail" type="button" aria-label="Ver detalle del monumento"
            [routerLink]="['/monumentos', 'detalles', monumento().id]" routerLinkActive="active">
      <!--&gt;-->
      >
    </button>
  </div>
</article>
