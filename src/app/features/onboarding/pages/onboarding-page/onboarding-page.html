<main class="onboarding-container">
    <div class="decoration">
        <h1 class="archivo-black-regular">ToroTour</h1>
        <img [src]="getCurrentILustracion()" alt="Ilustración onboarding" class="onboarding-ilustracion-image" [class.scale]="currentIndex !== 0" />
    </div>

    <div class="tutorial">
        <img [src]="getCurrentTabbarImg()" alt="Tabbar onboarding" class="onboarding-tabbar-image" />
        <p>{{getCurrentText()}}</p>
    </div>

    <section class="control">
        <div class="progress">
            <div class="progress-fill" [style.width.%]="progressPercent"></div>
        </div>

        <div class="buttons">
            <button (click)="prev()" [disabled]="isPrevDisabled" class="btn prev-btn" aria-label="Retroceder">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="btn-icon">
                    <path
                        d="M15 6l-6 6 6 6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </button>

            <button (click)="next()" class="btn next-btn" [attr.aria-label]="isLastImage ? 'Finalizar onboarding' : 'Imagen siguiente'">
                @if (isLastImage) 
                {
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="btn-icon">
                    <path
                        d="M20 6L9 17l-5-5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    </svg>
                } @else {
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="btn-icon">
                    <path
                        d="M9 6l6 6-6 6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    </svg>
                }
            </button>
        </div>
    </section>

</main>
