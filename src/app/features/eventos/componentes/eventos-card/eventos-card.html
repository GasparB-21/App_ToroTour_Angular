<article class="event-card">
    <div class="event-card__image" aria-hidden="true">
        <img [src]="evento().imagen || 'assets/images/event-placeholder.jpg'" 
            [alt]="'Imagen de ' + evento().titulo"
            loading="lazy">
    </div>
  
    <div class="event-card__content">
      <h3 class="event-card__title">{{ evento().titulo }}</h3>
      <p class="event-card__meta"><u>Categoria</u>: {{ evento().categoria }}</p>
      <p class="event-card__meta"><u>Localidad</u>: {{ evento().nombreLocalidad }}, {{evento().nombreProvincia}}</p>
    </div>
  
    <div class="event-card__actions">
      <button class="event-card__icon-button event-card__icon-button--favorite"
              [class.is-favorite]="esFavorito()"
              type="button"
              aria-label="Anadir o quitar de favoritos"
              [attr.aria-pressed]="esFavorito()"
              (click)="actualizarFavorito()">
        <svg viewBox="0 0 24 24"  width="30"  height="30" fill="currentColor" aria-hidden="true">
          <path d="M12 20l-7-7a4 4 0 0 1 6-5l1 1 1-1a4 4 0 0 1 6 5z"/>
        </svg>
      </button>
      
      <a class="event-card__icon-button event-card__icon-button--detail" aria-label="Navegar a detalles del evento"
              [routerLink]="['/eventos', 'detalles', evento().id]" routerLinkActive="active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"  aria-hidden="true">
          <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
    </a>
    </div>
  </article>
