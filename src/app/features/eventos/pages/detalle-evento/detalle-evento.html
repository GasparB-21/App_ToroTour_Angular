<main class="wrap">
    <header class="detail-header">
      <h1 class="detail-header__title">{{ evento()?.titulo }}</h1>
      <a href="javascript:history.back()" class="btn-close" aria-label="Cerrar y volver a la página anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M9 12h10" stroke-linecap="round"></path>
        </svg>
      </a>
    </header>
  
    <div class="detail-scroll-area">
      <section class="event-tags">
        <div class="info-box box-blue">
          <span class="label">Categoría:</span>
          <span class="value">{{ evento()?.categoria }}</span>
        </div>
        <div class="info-box box-blue">
          <span class="label">Temática:</span>
          <span class="value">{{ evento()?.tematica }}</span>
        </div>
      </section>
  
      <section class="main-visual-container">
        <img [src]="evento()?.imagen || 'images/placeholder.png'"
             [alt]="evento()?.titulo"
             (error)="onImgError($event)" 
             class="event-image-fit" />
      </section>

      <app-directions
        [coordenadas]="evento()?.coordenadas"
        [localidad]="evento()?.nombreLocalidad"
        [provincia]="evento()?.nombreProvincia">
      </app-directions>  
      
      <section class="event-info-table">
        <div class="info-box box-yellow">
          <span class="label">Fechas evento:</span>
          <span class="value">{{ evento()?.fecha?.inicio }}</span>
        </div>
        <div class="info-box box-yellow">
          <span class="label">Horario evento:</span>
          <span class="value">{{ evento()?.hora?.inicio }}</span>
        </div>
        <div class="info-split">
          <div class="info-box box-white">
            <span class="label">Público:</span>
            <span class="value">{{ evento()?.destinatarios || 'General' }}</span>
          </div>
          <div class="info-box box-white">
            <span class="label">Precio:</span>
            <span class="value">{{ evento()?.precio || 'Gratuito' }}</span>
          </div>
        </div>
      </section>
  
      <section class="description-section">
        <div class="description-box" [innerHTML]="evento()?.descripcion"></div>
      </section>
    </div>
  
    <button class="event-card__icon-button event-card__icon-button--favorite"
      [class.is-favorite]="esFavorito()"
      type="button"
      aria-label="Anadir o quitar de favoritos"
      [attr.aria-pressed]="esFavorito()"
      (click)="actualizarFavorito()">
     
      <svg viewBox="0 0 24 24"  width="50"  height="50" fill="currentColor" aria-hidden="true">
            <path d="M12 20l-7-7a4 4 0 0 1 6-5l1 1 1-1a4 4 0 0 1 6 5z"/>
        </svg>
    </button>
  </main>
